name: Deploy Docs to Cloudflare Pages

# [user-action]: The Cloudflare Pages project must be created manually before
# this workflow can deploy. Steps:
#   1. Go to https://dash.cloudflare.com → Pages → Create a project
#   2. Connect to the GitHub repo skaisser/howl
#   3. Set build command: npm run docs:build
#   4. Set build output directory: docs/.vitepress/dist
#   5. Add custom domain: howl.skaisser.dev
#   6. Add repo secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#   7. Add repo secret: CLOUDFLARE_PROJECT_NAME (your Pages project name)
# DNS: Add a CNAME at skaisser.dev DNS → <project>.pages.dev for howl.skaisser.dev

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'

  # Allow manual deploy trigger from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress docs
        run: npm run docs:build

      - name: Build llms-full.txt
        run: npm run docs:build:llms

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: docs/.vitepress/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
