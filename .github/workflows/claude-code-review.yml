name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Post APPROVED review on no-findings
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Count inline review comments left by claude[bot] on the HEAD commit.
          # If zero, the bot reviewed cleanly with no findings — submit an
          # explicit APPROVED review so downstream auto-merge stamps it.
          INLINE_COUNT=$(gh api "repos/$OWNER/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]" and .commit_id == "'"$COMMIT_SHA"'")] | length')

          echo "claude[bot] inline comments on commit $COMMIT_SHA: $INLINE_COUNT"

          if [ "$INLINE_COUNT" = "0" ]; then
            echo "No inline findings — posting APPROVED review."
            gh api "repos/$OWNER/$REPO/pulls/$PR_NUMBER/reviews" \
              -f event=APPROVE \
              -f body="✅ Automated code review by @claude — no blocking issues found." \
              -f commit_id="$COMMIT_SHA"
          else
            echo "Bot left $INLINE_COUNT inline comments — skipping APPROVE summary."
          fi

